name: Live generation matrix

on:
  schedule:
    - cron: "17 3 * * *"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package-manager: [pnpm, npm, bun]
        topology: [web, mobile, monorepo]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        if: matrix.package-manager == 'bun'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/run-live-matrix.mjs ${{ matrix.package-manager }} ${{ matrix.topology }}
        env:
          CAPTAIN_MATRIX_ROOT: matrix-output
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.package-manager }}-${{ matrix.topology }}-diagnostics
          path: matrix-output
          if-no-files-found: warn
